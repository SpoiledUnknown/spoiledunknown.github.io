# CI/CD Workflow: Build and Deploy Vue 3 + TypeScript SPA to GitHub Pages
name: Deploy Vue SPA to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows manual runs from GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between in-progress and latest.
# Production deployments in progress are not cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: Typecheck, lint, and compile Vue 3 + Vite SPA
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest)
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"

      - name: Install clean dependencies
        run: npm ci

      - name: Lint and code analysis
        run: npm run lint

      - name: Compile and bundle Vue 3 SPA
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages distribution artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Deploy job: Deploy the compiled dist artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
