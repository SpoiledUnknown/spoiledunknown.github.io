<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Shashank Raj</title>
    <meta
      name="description"
      content="Personal portfolio of Shashank Raj (@spoiledunknown) — Full-stack web architect, Unity game developer, and creator of XtremeFPS Controller and Richcord."
    />
    <link rel="icon" type="image/x-icon" href="/spoiledunknown.ico" />

    <!-- Anti-FOUC Early Theme Detection Script -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("spoiledunknown-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = savedTheme ? savedTheme === "dark" : prefersDark;

          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Web3Forms & hCaptcha scripts -->
    <script
      src="https://js.hcaptcha.com/1/api.js?recaptchacompat=off&render=explicit"
      async
      defer
    ></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
  </head>
  <body class="bg-surface-obsidian text-on-surface">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
